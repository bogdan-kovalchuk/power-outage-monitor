; PlatformIO configuration for Power Outage Monitor ESP32 firmware
; Microcontroller: ESP32 DevKit 38-pin (ESP32-WROOM-32D / V1)

[platformio]
default_envs = esp32dev

[env]
lib_deps =
    bblanchon/ArduinoJson@7.4.3
; Keep ArduinoJson stream support disabled across all builds so host tests
; match the target firmware configuration.
build_flags =
    -D ARDUINOJSON_ENABLE_STD_STREAM=0

[env:esp32dev]
platform = platformio/espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
build_src_flags = -Wall -Wextra
; Two 1.9 MB OTA slots; the image is ~1.1 MB and default 1.3 MB slots leave too little margin.
board_build.partitions = min_spiffs.csv
board_build.embed_files = data/cert/x509_crt_bundle.bin
; Host-side unit tests never run on the device.
test_ignore = *

[env:native]
platform = platformio/native@1.2.1
test_framework = unity
extra_scripts = pre:scripts/native_toolchain.py
build_flags =
    ${env.build_flags}
    -std=gnu++11
    -Wall
    -Wextra
    -Isrc
    -Itest/support
build_src_filter =
    -<*>
    +<power_sensor.cpp>
    +<wifi_connector.cpp>
    +<setup_ap.cpp>
    +<config_codec.cpp>
    +<protocol_helpers.cpp>
test_build_src = yes

[env:payloads]
platform = platformio/native@1.2.1
extra_scripts = pre:scripts/native_toolchain.py
build_flags = ${env:native.build_flags}
build_src_filter =
    ${env:native.build_src_filter}
    +<../host/payload_dump.cpp>
